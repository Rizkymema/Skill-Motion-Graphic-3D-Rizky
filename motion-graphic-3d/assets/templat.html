<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Graphic 3D</title>
<!--
  MOTION GRAPHIC 3D — satu file mandiri: dunia 3D (Three.js tertanam) + lapisan 2D + pemutar + cek kualitas + ekspor MP4
  (tanpa server, tanpa unduhan, jalan offline).
  Cara pakai: buka di Chrome/Edge → ▶ untuk pratinjau → "Ekspor MP4" untuk menyimpan video.
  Yang disunting per video HANYA blok skrip "konfig" (KONFIG + ADEGAN) dan, bila ada suara, blok "data-suara".
  Blok skrip "three-js" (Three.js r147, MIT), "inti3d" (mesin 3D) dan "inti" (mesin 2D, pemutar, suara, ekspor) adalah mesin
  skill motion-graphic-3d; jangan disunting per video. Butuh WebGL (Chrome/Edge dengan akselerasi grafis).
  URL: ?t=12 mulai dari detik 12 · ?render sembunyikan kontrol (untuk otomatisasi) · ?cek jalankan cek kualitas saat dibuka.
-->
<style>
  :root { --bg:#07090f; --ui:#141a26; --ui2:#1f2738; --tx:#e8ecf4; --mut:#8a94a8; --ak:#ffbe0b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tx); font:14px/1.4 "Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #panggung { position:absolute; inset:0 0 64px 0; display:flex; align-items:center; justify-content:center; }
  #kanvas { display:block; box-shadow:0 10px 60px rgba(0,0,0,.6); background:#000; }
  #kendali { position:absolute; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--ui); border-top:1px solid #222b3d; box-sizing:border-box; }
  #kendali button, #kendali label { background:var(--ui2); color:var(--tx); border:0; border-radius:8px; padding:8px 11px; font:600 13px inherit; cursor:pointer; white-space:nowrap; }
  #kendali button:hover { filter:brightness(1.25); }
  #kendali button.utama { background:var(--ak); color:#111; }
  #main { width:46px; font-size:16px; }
  #geser { flex:1; min-width:80px; accent-color:var(--ak); }
  #waktu { font:600 13px ui-monospace, Consolas, monospace; color:var(--mut); min-width:118px; text-align:center; }
  #tanda { position:absolute; left:0; right:0; top:-6px; height:6px; pointer-events:none; }
  #panel { position:absolute; right:12px; bottom:76px; width:min(440px, calc(100vw - 24px)); max-height:60vh; overflow:auto; background:rgba(20,26,38,.97); border:1px solid #2a3550; border-radius:12px; padding:12px 14px; display:none; white-space:pre-wrap; font:12.5px/1.5 ui-monospace, Consolas, monospace; z-index:5; }
  #panel b { color:var(--ak); }
  #panel .tutup { float:right; cursor:pointer; color:var(--mut); }
  body.render #kendali, body.render #panel { display:none; }
  body.render #panggung { inset:0; }
  @media (max-width:700px) { #kendali { flex-wrap:wrap; height:auto; padding:6px; } #panggung { bottom:110px; } #waktu { min-width:auto; } }
</style>
</head>
<body>
<div id="panggung"><canvas id="kanvas"></canvas></div>
<div id="kendali">
  <button id="main" title="Putar/jeda (spasi)">▶</button>
  <div style="position:relative; flex:1; display:flex"><input id="geser" type="range" min="0" max="1" step="0.001" value="0"><div id="tanda"></div></div>
  <span id="waktu">0.00 / 0.00</span>
  <button id="hd" title="Kualitas pratinjau">HD</button>
  <button id="bisu" title="Suara pratinjau">🔊</button>
  <button id="cek">Cek</button>
  <button id="kontak">Kontak</button>
  <button id="thumb">Thumbnail</button>
  <label title="Muat file suara (L01.mp3 …) atau musik">Muat suara<input id="muat" type="file" accept="audio/*" multiple hidden></label>
  <button id="ekspor" class="utama">Ekspor MP4</button>
</div>
<div id="panel"></div>

<!-- Suara (opsional): {"baris":[{"id":"L01","teks":"...","src":"data:audio/mpeg;base64,..."}], "kata":[[mulai,akhir,"kata"],...]} -->
<script id="data-suara" type="application/json">null</script>

<script id="three-js">/*THREE*/</script>

<script id="konfig">
/* =====================================================================
   KONFIG + ADEGAN — satu-satunya bagian yang diubah per video (jalankan.py rakit menggantinya dari konfig.js).
   Satuan meter, y ke atas, tokoh menghadap +z. dunia(d) dibangun sekali; gambar(g) = lapisan 2D di atasnya.
   API: references/mesin.md (3D) + references/mesin-2d.md (2D, suara). Contoh lengkap: contoh/*.konfig.js
   ===================================================================== */
const KONFIG = {
  judul: 'Contoh motion graphic 3D', rasio: '9:16', fps: 30, gaya: 'kartun', suasana: 'kobalt',
  tokoh: { raka: { kulit: '#F2C9A0', rambut: 'pendek', warnaRambut: '#2B1B12', baju: '#F2B134', kerah: 'hoodie', celana: '#2A3350' } },
  teks: [{ mulai: .3, akhir: 3, teks: 'Halo, ini dunia tiga dimensi.' }],
  musik: { sintesis: 'pulsa', bpm: 104, vol: .45 }
};
const ADEGAN = [
  { id: 'halo', durasi: 3.5, suasana: 'kobalt',
    kamera: [[0, { dari: [0, 1.5, 5.2], ke: [0, 1.1, 0] }], [3.5, { dari: [1.2, 1.4, 4.4] }, 'inOutSine']],
    dunia(d) {
      d.studio();
      d.tokoh('raka', { posisi: [0, 0, 0], pose: [[0, 'lambai'], [1.6, 'presentasi']], ekspresi: [[0, 'gembira'], [1.6, 'senang']], bicara: true });
      d.ikon('bintang', { posisi: [1.1, 2.1, -.4], ukuran: .6, muncul: .4, putarTerus: [0, 80, 0], ayun: true });
    },
    gambar(g, t) { g.teksMasuk('HALO *3D*', 540, 300, t, { mulai: .3, ukuran: 96, gaya: 'pop', garis: P.gelap, tebalGaris: 12 }); } }
];
</script>

<script id="inti3d">/*MESIN3D*/</script>

<script id="inti">
/* =====================================================================
   MESIN 2D motion-graphic-3d (turunan mesin motion-graphic v2): lapisan 2D di atas dunia 3D, subtitle, suara, cek, ekspor.
   Adegan yang punya dunia(d) digambar mesin 3D (blok inti3d) lebih dulu. Jangan disunting per video.
   Semua gambar dihitung dari waktu t lewat seek(t): deterministik, bisa diekspor bingkai demi bingkai.
   ===================================================================== */
'use strict';
const K = (typeof KONFIG !== 'undefined' && KONFIG) || {};
const ADG = (typeof ADEGAN !== 'undefined' && ADEGAN) || [];
const Q = new URLSearchParams(location.search);
const MODE_RENDER = Q.has('render');
const [W, H] = K.rasio === '16:9' ? [1920, 1080] : [1080, 1920];
const POTRET = H > W, U = Math.min(W, H) / 1080, CX = W / 2, CY = H / 2;
const FPS = K.fps || 30;
/* SUASANA (= "keadaan" adegan) = paket warna + cahaya + efek menurut tempat, waktu, dan perasaan adegan. Warna kaya dan berani ala RicksClips3000

   cokelat-hitam yang bernuansa (`gelap`), lampu hangat, bayangan berwarna, sekeliling gelap pada adegan lampu sorot.

const SUASANA = {
  siang:  { palet: { latar: '#6FB4EC', utama: '#4F9A52', aksen: '#F2B134', kedua: '#D8402F', teks: '#FFFFFF', gelap: '#2A1A12', terang: '#F7F9F9' },
            cahaya: { sudut: -40, warna: '#FFF3D0', bayang: '#3C4F8A', tepi: '#FFFFFF', kabut: '#BFE3F8', kuat: 1 }, efek: { grain: .03, vinyet: .25, grade: .35 } },
  malam:  { palet: { latar: '#1E2A5E', utama: '#3A4BC5', aksen: '#FFB547', kedua: '#E0553A', teks: '#FFFFFF', gelap: '#0A0A2A', terang: '#EAF0FF' },
            cahaya: { sudut: 35, warna: '#BCD0FF', bayang: '#0E1240', tepi: '#8FB2FF', kabut: '#2B3A7A', kuat: 1 }, efek: { grain: .04, vinyet: .5, grade: .5 } },
  kobalt: { palet: { latar: '#2D418E', utama: '#4A9AE1', aksen: '#FFC24A', kedua: '#D8402F', teks: '#FFFFFF', gelap: '#0C1967', terang: '#F7F9F9' },
            cahaya: { sudut: -30, warna: '#FFFFFF', bayang: '#2B3B8F', tepi: '#CFE6FF', kabut: '#9DB8F0', kuat: 1 }, efek: { grain: .03, vinyet: .3, grade: .3 } },
  oranye: { palet: { latar: '#C87442', utama: '#CD4522', aksen: '#F2C14E', kedua: '#2F6FB0', teks: '#FFFFFF', gelap: '#2B1210', terang: '#FBE9D0' },
            cahaya: { sudut: 50, warna: '#FFC080', bayang: '#582626', tepi: '#FFE0B0', kabut: '#E8A56B', kuat: 1.05 }, efek: { grain: .04, vinyet: .4, grade: .5 } },
  hijau:  { palet: { latar: '#8EBE88', utama: '#397336', aksen: '#F2C14E', kedua: '#D8402F', teks: '#FFFFFF', gelap: '#1F2B2A', terang: '#F2F4E8' },
            cahaya: { sudut: -40, warna: '#FFF6D0', bayang: '#2F5A6E', tepi: '#FFFFFF', kabut: '#C5E0C0', kuat: 1 }, efek: { grain: .03, vinyet: .28, grade: .3 } },
  sorot:  { palet: { latar: '#2D241B', utama: '#6B584B', aksen: '#FFC25A', kedua: '#C0452F', teks: '#FFFFFF', gelap: '#120F0F', terang: '#E6CBB6' },
            cahaya: { sudut: 0, warna: '#FFD68A', bayang: '#120F0F', tepi: '#FFE7B0', kabut: '#3A2E22', kuat: 1.2 }, efek: { grain: .05, vinyet: .6, grade: .5 } },
  aula:   { palet: { latar: '#756669', utama: '#322F43', aksen: '#E0B040', kedua: '#8C2F2F', teks: '#FFFFFF', gelap: '#1A1822', terang: '#E9E3DA' },
            cahaya: { sudut: -35, warna: '#FFE8C0', bayang: '#2A2840', tepi: '#E0D0C0', kabut: '#8A7C80', kuat: 1 }, efek: { grain: .045, vinyet: .45, grade: .4 } },
  senja:  { palet: { latar: '#5572BC', utama: '#973F71', aksen: '#FFB35A', kedua: '#E05A44', teks: '#FFFFFF', gelap: '#1E1B45', terang: '#F3E3E0' },
            cahaya: { sudut: 55, warna: '#FFB070', bayang: '#3A2B6B', tepi: '#FFD0A0', kabut: '#9C6FA0', kuat: 1.05 }, efek: { grain: .04, vinyet: .4, grade: .5 } }
};
const SU = SUASANA[K.suasana] || null;
const P_DASAR = Object.assign({}, SUASANA.siang.palet, (SU && SU.palet) || {}, K.palet || {});
const P = Object.assign({}, P_DASAR);   // palet adegan yang sedang digambar (diatur aturKeadaan tiap adegan)
/** paletSuasana('malam') = palet lengkap suasana itu (untuk warna lokal tanpa mengganti P) */
function paletSuasana(n) { return Object.assign({}, (SUASANA[n] || SUASANA.siang).palet); }
const GAYA_DASAR = {
  flat:   { grain: 0.05, vinyet: 0.38, glow: 0, kertas: 0 },
  neon:   { grain: 0.045, vinyet: 0.55, glow: 1, kertas: 0 },
  kertas: { grain: 0.075, vinyet: 0.3, glow: 0, kertas: 1 },
  // sinematik 2.5D bercahaya: cahaya berarah + bayangan berlapis + garis tepi bercahaya, kabut jarak,
  // latar kabur (dihitung sekali per adegan), mekar (bloom), grading hangat-dingin + vinyet + grain dalam satu lintasan
  sinema: { grain: 0.06, vinyet: 0.55, glow: 0, kertas: 0, sinema: 1, mekar: 0, grade: 0.6 },
  // kartun (acuan warna RicksClips3000): pencahayaan sinema + garis tepi tebal bernuansa di semua benda; tokoh TETAP tokoh sinema (stickman hanya bila definisi tokoh bergaya: 'stickman')
  kartun: { grain: 0.035, vinyet: 0.35, glow: 0, kertas: 0, sinema: 1, mekar: 0, grade: 0.35, kartun: 1, tepi: 7 },
  // gaya bahan 3D lain: lapisan 2D tetap bergaya kartun (tanpa garis tepi di clay/mainan/lowpoly)
  clay:    { grain: 0.04, vinyet: 0.32, glow: 0, kertas: 0, sinema: 1, mekar: 0, grade: 0.3 },
  mainan:  { grain: 0.03, vinyet: 0.3, glow: 0, kertas: 0, sinema: 1, mekar: 0, grade: 0.3 },
  lowpoly: { grain: 0.035, vinyet: 0.33, glow: 0, kertas: 0, sinema: 1, mekar: 0, grade: 0.3 }
};
const GAYA_AWAL = Object.assign({}, GAYA_DASAR[K.gaya] || GAYA_DASAR.kartun, (SU && SU.efek) || {}, K.efek || {});
const GAYA = Object.assign({}, GAYA_AWAL);   // efek adegan yang sedang digambar
/* cahaya adegan (gaya sinema): sudut = arah datang cahaya dalam derajat (0 = dari atas, -90 = kiri, 90 = kanan),
   warna = cahaya kunci, bayang = warna sisi gelap, tepi = cahaya tepi (rim), kuat 0..1.5, kabut = warna jarak jauh */
const CAHAYA_DASAR = { sudut: -40, warna: '#FFEBC4', bayang: '#556B93', tepi: '#FFFFFF', kuat: 1 };
let CAHAYA = null;
function aturCahaya(a) {
  const c = Object.assign({}, CAHAYA_DASAR, { kabut: P.latar }, (SU && SU.cahaya) || {}, K.cahaya || {},
    (a && a.suasana && SUASANA[a.suasana] && SUASANA[a.suasana].cahaya) || {}, (a && a.cahaya) || {});
  const r = (c.sudut * Math.PI) / 180; c.dx = Math.sin(r); c.dy = -Math.cos(r);
  CAHAYA = c; return c;
}
/** keadaan adegan: palet + efek mengikuti adegan.suasana (lalu adegan.palet / adegan.efek); tanpa itu = palet dan efek video */
function aturKeadaan(a) {
  const sa = a && a.suasana && SUASANA[a.suasana];
  Object.assign(P, P_DASAR, (sa && sa.palet) || {}, (a && a.palet) || {});
  Object.assign(GAYA, GAYA_AWAL, (sa && sa.efek) || {}, (a && a.efek) || {});
}
const FONT = {
  judul: (K.font && K.font.judul) || '"Montserrat","Poppins","Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif',
  teks: (K.font && K.font.teks) || '"Inter","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif',
  mono: '"JetBrains Mono","Consolas","Courier New",monospace'
};
// zona aman: 9:16 = bawah 25% dan kanan 13% tertutup UI Shorts/Reels/TikTok
const ZONA = POTRET ? { atas: 0.09 * H, bawah: 0.66 * H, kiri: 0.05 * W, kanan: 0.87 * W, sub: 0.705 * H }
                    : { atas: 0.05 * H, bawah: 0.80 * H, kiri: 0.04 * W, kanan: 0.96 * W, sub: 0.865 * H };

/* ------------------------------------------------------------- utilitas */
const jepit = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  linear: x => x, inQuad: x => x * x, outQuad: x => 1 - (1 - x) * (1 - x), inOutQuad: x => (x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2),
  inCubic: x => x ** 3, outCubic: x => 1 - (1 - x) ** 3, inOutCubic: x => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
  inQuart: x => x ** 4, outQuart: x => 1 - (1 - x) ** 4, inOutQuart: x => (x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2),
  outQuint: x => 1 - (1 - x) ** 5, inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  inExpo: x => (x <= 0 ? 0 : 2 ** (10 * x - 10)), outExpo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  inOutExpo: x => (x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
  inBack: x => 2.70158 * x ** 3 - 1.70158 * x * x,
  outElastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1),
  pegas: x => (x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(x * Math.PI * 2.6)),
  outBounce: x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
};
const fe = e => (typeof e === 'function' ? e : E[e] || E.outCubic);
/** kemajuan 0..1 dengan easing: maju(t, mulai, lama, 'outBack') */
function maju(t, mulai = 0, lama = 1, ease = 'outCubic') { return fe(ease)(jepit((t - mulai) / Math.max(1e-6, lama))); }
/** antara(t, a, b): 1 selama a ≤ t < b, dengan masuk/keluar halus selebar f detik */
function antara(t, a, b, f = 0.25) { return Math.min(maju(t, a, f, 'outCubic'), 1 - maju(t, b - f, f, 'inCubic')); }
function acak(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function derau(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(acak(i), acak(i + 1), u) * 2 - 1; }
function rgb(h) { if (Array.isArray(h)) return h; const m = String(h).match(/rgba?\(([^)]+)\)/); if (m) return m[1].split(',').slice(0, 3).map(v => parseFloat(v)); h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function campur(a, b, k) { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], jepit(k)))).join(',') + ')'; }
function alfa(c, a) { if (String(c).startsWith('rgb')) return c.replace(/rgba?\(([^)]+)\)/, (m, s) => 'rgba(' + s.split(',').slice(0, 3).join(',') + ',' + a + ')'); const [r, g, b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function rupiah(n) { return 'Rp' + Math.max(0, Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function ribuan(n, des = 0) { const s = Number(n).toFixed(des).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return s.join(','); }
/** keyframe: kunci(t, [[0, 10], [1, 50, 'outBack'], [2, [1,2]]]) — angka, larik angka, atau warna '#hex' */
function kunci(t, kf) {
  if (!kf || !kf.length) return undefined;
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) {
    if (t < kf[i][0]) {
      const [t0, a] = kf[i - 1], [t1, b, e] = kf[i], k = fe(e || 'inOutCubic')((t - t0) / (t1 - t0));
      if (typeof a === 'number') return lerp(a, b, k);
      if (typeof a === 'string' && a[0] === '#') return campur(a, b, k);
      if (Array.isArray(a)) return a.map((v, j) => lerp(v, b[j], k));
      if (typeof a === 'object') { const o = {}; for (const q in Object.assign({}, a, b)) o[q] = lerp(a[q] ?? b[q], b[q] ?? a[q], k); return o; }
      return k < .5 ? a : b;
    }

  return kf[kf.length - 1][1];
}

/* ------------------------------------------------------------- suara + waktu */
let MUSIK_FILE = null, MULAI_NARASI = 0.3, SUARA = null, KATA = [], BUFFER_SUARA = {}, BUFFER_MUSIK = null, BUFFER_NARASI = null, BUFFER_SFX = {}, A = [], DURASI = 1, SIAP = false;
function bacaSuara() {
  let s = null;
  try { s = JSON.parse(document.getElementById('data-suara').textContent || 'null'); } catch (e) { s = null; }
  return s || K.suara || null;
}
/** waktu film dari angka atau rujukan: 'L03', 'L03.akhir', 'L03.w2', 'hook', 'hook.akhir', ditambah '+0.4' / '-0.2' */
function w(v, dasar = 0) {
  if (v === undefined || v === null) return undefined;
  if (typeof v === 'number') return v + dasar;
  const m = String(v).replace(/\s+/g, '').match(/^([A-Za-z_][\w-]*?)(?:\.(akhir|w\d+))?([+-][\d.]+)?$/);
  if (!m) { const n = parseFloat(v); return isNaN(n) ? undefined : n + dasar; }
  const [, id, bag, geser] = m, g = geser ? parseFloat(geser) : 0;
  const b = SUARA && (SUARA.baris || []).find(x => x.id === id);
  if (b) {
    if (!bag) return b.mulai + g;
    if (bag === 'akhir') return b.mulai + b.durasi + g;
    const n = parseInt(bag.slice(1), 10), ks = KATA.filter(k => k[0] >= b.mulai - .05 && k[0] < b.mulai + b.durasi + .05);
    return (ks.length ? (ks[n - 1] || ks[ks.length - 1])[0] : b.mulai) + g;
  }

/* cadangan: rekam waktu nyata (MediaRecorder) bila WebCodecs tidak ada */
async function rekamRealtime(progres) {

  const aliran = KANVAS.captureStream(FPS); tujuan.stream.getAudioTracks().forEach(t => aliran.addTrack(t));
  const rek = new MediaRecorder(aliran, { mimeType: tipe, videoBitsPerSecond: 12e6 }), potong = [];
  rek.ondataavailable = e => e.data.size && potong.push(e.data);

}

/* ------------------------------------------------------------- cek kualitas, lembar kontak, thumbnail */
function luasIris(a, b) { const x = Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)), y = Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0)); return x * y; }
function hasilCek(langkah = 0.25) {
  const salah = [], saran = [], skalaLama = SK; aturSkala(.25);
  const kecil = document.createElement('canvas'); kecil.width = 27; kecil.height = Math.round(27 * H / W); const kx = kecil.getContext('2d', { willReadFrequently: true });
  let prev = null; const ubah = [], lamaTeks = {}, catat = (arr, pesan) => { if (!arr.includes(pesan)) arr.push(pesan); };

  for (let t = 0; t <= DURASI + 1e-6; t += langkah) {
    seek(t);
    const teks = REG.teks.filter(x => !x.tr), sub = REG.sub[0];
    teks.forEach(x => {
      lamaTeks[x.s] = (lamaTeks[x.s] || 0) + langkah;
      // 9:16: tombol suka/komentar di kanan mulai ±42% tinggi, keterangan + nama akun di bawah 76%
      if (x.x0 < -2 || x.x1 > W + 2 || x.y0 < -2 || x.y1 > H + 2) catatW(salah, t, `teks keluar layar: "${x.s.slice(0, 40)}"`);
      else if ((POTRET && x.x1 > ZONA.kanan + 4 && x.y1 > .42 * H) || x.y1 > (POTRET ? .76 * H : ZONA.bawah + .1 * H)) catatW(salah, t, `teks masuk area tombol/keterangan aplikasi: "${x.s.slice(0, 40)}"`);
      else if (x.y0 < ZONA.atas - 4 || x.x0 < ZONA.kiri - 4 || x.x1 > W - ZONA.kiri + 4) catatW(saran, t, `teks terlalu dekat tepi: "${x.s.slice(0, 40)}"`);
      if (x.uk < 34) catatW(saran, t, `teks kecil (${Math.round(x.uk)} px), sulit terbaca di HP: "${x.s.slice(0, 30)}"`);
      if (sub && luasIris(x, sub) > 0.08 * Math.min((x.x1 - x.x0) * (x.y1 - x.y0), (sub.x1 - sub.x0) * (sub.y1 - sub.y0))) catatW(salah, t, `teks bertabrakan dengan subtitle: "${x.s.slice(0, 40)}"`);
    });
    for (let i = 0; i < teks.length; i++) for (let j = i + 1; j < teks.length; j++) { const a = teks[i], b = teks[j], m = Math.min((a.x1 - a.x0) * (a.y1 - a.y0), (b.x1 - b.x0) * (b.y1 - b.y0)); if (luasIris(a, b) > .12 * m) catatW(salah, t, `teks saling menimpa: "${a.s.slice(0, 24)}" × "${b.s.slice(0, 24)}"`); }
    if (sub) REG.subjek.filter(x => !x.tr).forEach(f => { if (luasIris(f, sub) > .15 * (f.x1 - f.x0) * (f.y1 - f.y0)) catatW(salah, t, `subtitle menutupi wajah tokoh "${f.id}" (geser tokoh ke atas atau perkecil)`); });
    kx.drawImage(KANVAS, 0, 0, kecil.width, kecil.height); const d = kx.getImageData(0, 0, kecil.width, kecil.height).data; const lum = [];
    for (let i = 0; i < d.length; i += 4) lum.push(d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11);
    const rata = lum.reduce((a, b) => a + b, 0) / lum.length, varian = lum.reduce((a, b) => a + (b - rata) ** 2, 0) / lum.length;
    if (varian < 6 && !ADA_TRANSISI && t > .1 && t < DURASI - .1) catatW(salah, t, `bingkai kosong/polos`);
    if (prev) ubah.push([t, lum.reduce((a, b, i) => a + Math.abs(b - prev[i]), 0) / lum.length]); prev = lum;

  jejak.forEach(({ arr, pesan, t: ts }) => {
    const r = []; ts.forEach(t => { const z = r[r.length - 1]; if (z && t - z[1] <= langkah * 1.6) z[1] = t; else r.push([t, t]); });
    arr.push(r.map(([a, b]) => (a === b ? a.toFixed(2) : a.toFixed(2) + '–' + b.toFixed(2))).slice(0, 4).join(', ') + (r.length > 4 ? ' …' : '') + ' dtk: ' + pesan);
  });
  // ritme: perubahan visual setiap 1,5–3 detik
  for (let i = 0; i < ubah.length; i++) { let jumlah = 0, j = i; while (j < ubah.length && ubah[j][0] - ubah[i][0] < 3) { jumlah += ubah[j][1]; j++; } if (j < ubah.length && jumlah < 6) { catat(saran, `${fmt(ubah[i][0])}–${fmt(ubah[i][0] + 3)} hampir tidak ada perubahan visual (tambah gerak/elemen baru)`); i = j; } }
  Object.entries(lamaTeks).forEach(([s, d]) => { if (d < 1.0 && s.length > 3 && !/\d/.test(s)) catat(saran, `teks tampil < 1 dtk, sulit terbaca: "${s.slice(0, 40)}"`); });
  A.forEach(a => { if (a.d < .8) catat(saran, `adegan "${a.id}" hanya ${a.d.toFixed(2)} dtk`); if (a.d > 6) catat(saran, `adegan "${a.id}" ${a.d.toFixed(1)} dtk; pastikan ada perubahan tiap 1,5–3 dtk`); });
  const ragam = new Set(A.slice(1).map(a => a.masuk || 'potong')); if (A.length > 3 && ragam.size < 2) catat(saran, 'transisi kurang bervariasi');
  if (!semuaSfx().length) catat(saran, 'belum ada SFX');
  if (A.some(a => a.dunia) && M3.gagal) catat(salah, 'WebGL tidak tersedia: dunia 3D tidak tergambar');
  M3.statTokoh.forEach(({ a, id, o }) => { if (a.d < 3.2) return; const n = Array.isArray(o.pose) ? o.pose.length : 1, ne = Array.isArray(o.ekspresi) ? o.ekspresi.length : 1;
    if (n < 2 && ne < 2 && !o.jalan && !o.bicara && !o.anim && !o.naik) catat(saran, `tokoh "${id}" di adegan "${a.id}" berpose dan berekspresi sama ${a.d.toFixed(1)} dtk (ganti pose/ekspresi tiap 1,5–2,5 dtk, beri jalan atau bicara)`); });

  return { beres: !salah.length, salah, saran, durasi: DURASI, adegan: A.map(a => [a.id, +a.mulai.toFixed(2), +a.akhir.toFixed(2), a.masuk || 'potong']) };
}
function lembarKontak(n = 12) {
  const kol = POTRET ? 6 : 4, tw = POTRET ? 270 : 384, th = Math.round(tw * H / W), baris = Math.ceil(n / kol);
  const out = document.createElement('canvas'); out.width = kol * tw; out.height = baris * (th + 34); const o = out.getContext('2d'); o.fillStyle = '#111'; o.fillRect(0, 0, out.width, out.height);
  const skalaLama = SK; aturSkala(.5);
  for (let i = 0; i < n; i++) { const t = DURASI * (i + .5) / n; seek(t); const x = (i % kol) * tw, y = Math.floor(i / kol) * (th + 34); o.drawImage(KANVAS, x, y + 34, tw, th); o.fillStyle = '#ddd'; o.font = '600 18px sans-serif'; o.fillText(`${t.toFixed(1)}s · ${A[adeganDi(t)].id}`, x + 8, y + 24); }

}
function thumbnail() {
  const th = K.thumbnail || {}, skalaLama = SK; aturSkala(1); seek(w(th.t) ?? DURASI * .3, { tanpaSub: true });
  const c = ctx; c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(.45, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (th.teks) { const gb = new Gambar(c, A[0], 0, 0); gb.teks(th.teks, CX, th.y ? th.y * H : POTRET ? H * .2 : H * .24, { ukuran: POTRET ? 150 : 140, garis: '#000', tebalGaris: 22, aksen: th.warna || P.aksen, maks: W * .86, cek: false }); }

  if (POTRET) url = KANVAS.toDataURL('image/png');
  else { const o = document.createElement('canvas'); o.width = 1280; o.height = 720; o.getContext('2d').drawImage(KANVAS, 0, 0, 1280, 720); url = o.toDataURL('image/png'); }

}

/* ------------------------------------------------------------- pemutar + UI */
let WAKTU = 0, MAIN = false, MULAI_PERF = 0, MULAI_T = 0, AC_PRATINJAU = null, SUMBER = null, BISU = false;
const catatan = [];
const $ = id => document.getElementById(id);
function tampilkan(teks) { const p = $('panel'); p.innerHTML = '<span class="tutup" onclick="this.parentNode.style.display=\'none\'">✕</span>' + teks; p.style.display = 'block'; }
function unduh(url, nama) { const a = document.createElement('a'); a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove(); }
const namaFile = ext => (K.judul || 'animasi').replace(/[\\/:*?"<>|]+/g, '').trim() + ext;
function pasUkuran() {
  if (MODE_RENDER) { KANVAS.style.width = W + 'px'; KANVAS.style.height = H + 'px'; return; }
  const box = $('panggung').getBoundingClientRect(), s = Math.min((box.width - 20) / W, (box.height - 20) / H);
  KANVAS.style.width = Math.floor(W * s) + 'px'; KANVAS.style.height = Math.floor(H * s) + 'px';
}
function perbaruiUI() { $('waktu').textContent = WAKTU.toFixed(2) + ' / ' + DURASI.toFixed(2); $('geser').value = DURASI ? WAKTU / DURASI : 0; $('main').textContent = MAIN ? '❚❚' : '▶'; }
function tandaAdegan() { $('tanda').innerHTML = A.map(a => `<i title="${a.id}" style="position:absolute;left:${a.mulai / DURASI * 100}%;width:2px;height:6px;background:#ffbe0b"></i>`).join(''); }
async function putar() {
  if (WAKTU >= DURASI - .02) WAKTU = 0;
  MAIN = true; MULAI_PERF = performance.now(); MULAI_T = WAKTU; perbaruiUI();
  if (!BISU) {
    try {
      AC_PRATINJAU = AC_PRATINJAU || new AudioContext(); await AC_PRATINJAU.resume();
      const buf = await audioPratinjau(); if (!MAIN) return;
      SUMBER = AC_PRATINJAU.createBufferSource(); SUMBER.buffer = buf; SUMBER.connect(AC_PRATINJAU.destination);
      const t0 = AC_PRATINJAU.currentTime + .05; SUMBER.start(t0, WAKTU); MULAI_PERF = performance.now() + 50; MULAI_T = WAKTU;
    } catch (e) { console.warn(e); }
  }
  requestAnimationFrame(langkah);
}
function jeda() { MAIN = false; LAMBAT.lalu = 0; LAMBAT.n = 0; LAMBAT.ema = 0; try { SUMBER && SUMBER.stop(); } catch (e) {} SUMBER = null; perbaruiUI(); }
/* pratinjau adaptif: bila komputer tidak sanggup ±22 bingkai/dtk di HD, pratinjau otomatis turun ke setengah resolusi
   (ekspor MP4 tetap penuh). Tombol HD/Cepat mematikan penyesuaian otomatis. ?hd=1 memaksa HD. */
let LAMBAT = { ema: 0, n: 0, manual: Q.get('hd') === '1', lalu: 0 };
function langkah() {
  if (!MAIN) return;
  const kini = performance.now();
  if (LAMBAT.lalu && !LAMBAT.manual && SK === 1) {
    const dt = Math.min(kini - LAMBAT.lalu, 120); LAMBAT.ema = LAMBAT.ema ? LAMBAT.ema * .92 + dt * .08 : dt; LAMBAT.n++;   // sentakan sesaat (cache adegan baru) tidak dihitung penuh
    if (LAMBAT.n > 24 && LAMBAT.ema > 46) { aturSkala(.5); $('hd').textContent = 'Cepat'; LAMBAT.manual = true; tampilkan('Pratinjau otomatis pindah ke mode <b>Cepat</b> (setengah resolusi) supaya lancar.\nEkspor MP4 tetap 1080p penuh. Tekan tombol Cepat/HD untuk mengganti.'); }
  }
  LAMBAT.lalu = kini;
  WAKTU = Math.min(DURASI, MULAI_T + (kini - MULAI_PERF) / 1000);
  seek(WAKTU); perbaruiUI();
  if (WAKTU >= DURASI) { jeda(); return; }
  requestAnimationFrame(langkah);
}
function pasangUI() {
  $('main').onclick = () => (MAIN ? jeda() : putar());
  $('geser').oninput = e => { jeda(); WAKTU = +e.target.value * DURASI; seek(WAKTU); perbaruiUI(); };
  $('hd').onclick = () => { LAMBAT.manual = true; aturSkala(SK === 1 ? .5 : 1); $('hd').textContent = SK === 1 ? 'HD' : 'Cepat'; seek(WAKTU); };
  $('bisu').onclick = () => { BISU = !BISU; $('bisu').textContent = BISU ? '🔇' : '🔊'; if (MAIN) { jeda(); putar(); } };
  $('cek').onclick = () => { jeda(); const r = hasilCek(); tampilkan(`<b>${r.beres ? 'BERES' : 'ADA MASALAH'}</b> · durasi ${r.durasi.toFixed(2)} dtk · ${r.adegan.length} adegan\n\n` + (r.salah.length ? '<b>SALAH</b>\n' + r.salah.join('\n') + '\n\n' : '') + (r.saran.length ? '<b>SARAN</b>\n' + r.saran.join('\n') : 'Tidak ada saran.')); };
  $('kontak').onclick = () => { jeda(); unduh(lembarKontak(), namaFile(' - kontak.jpg')); };
  $('thumb').onclick = () => { jeda(); unduh(thumbnail(), namaFile(' - thumbnail.png')); };
  $('muat').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return; jeda();
    const ac = new OfflineAudioContext(2, 1, 48000), s = SUARA || (SUARA = { baris: [] });
    for (const f of files) {
      const buf = await ac.decodeAudioData(await f.arrayBuffer()), stem = f.name.replace(/\.[^.]+$/, '').toLowerCase();
      if (/musik|music|bgm|backsound/.test(stem)) { BUFFER_MUSIK = buf; MUSIK_FILE = { vol: .35 }; K.musik = null; continue; }
      const b = (s.baris || []).find(x => x.id.toLowerCase() === stem);
      if (b) BUFFER_SUARA[b.id] = buf; else if (files.length === 1) BUFFER_NARASI = buf;
    }
    CACHE_AUDIO = null; await muatUlang(); tampilkan('Suara dimuat. Waktu adegan dan subtitle disesuaikan.');
  };
  $('ekspor').onclick = async () => {
    jeda(); const btn = $('ekspor'); btn.disabled = true;
    try { const blob = await eksporMP4({ progres: (p, s) => { btn.textContent = Math.round(p * 100) + '%'; tampilkan('Mengekspor… ' + s); } });
      unduh(URL.createObjectURL(blob), namaFile(blob.type.includes('webm') ? '.webm' : '.mp4')); tampilkan(`Selesai: ${namaFile('.mp4')} (${(blob.size / 1e6).toFixed(1)} MB). Cek folder Unduhan.`); }
    catch (e) { console.error(e); tampilkan('<b>Ekspor gagal</b>\n' + e.message); }

  };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); MAIN ? jeda() : putar(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { jeda(); WAKTU = jepit(WAKTU + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS), 0, DURASI); seek(WAKTU); perbaruiUI(); }
  });

}
async function muatUlang() { await siapkanSuara(); susunAdegan(); CACHE_LAPIS.clear(); hapusDunia3D(); susunPotongan(); tandaAdegan(); seek(WAKTU); perbaruiUI(); }

/* ------------------------------------------------------------- mulai */
(async () => {
  if (MODE_RENDER) document.body.classList.add('render');
  aturSkala(SK); pasUkuran(); pasangUI();
  try { await document.fonts.ready; } catch (e) {}
  await muatUlang();
  WAKTU = jepit(parseFloat(Q.get('t')) || 0, 0, DURASI); seek(WAKTU); perbaruiUI();
  if (!MODE_RENDER) $('hd').textContent = SK === 1 ? 'HD' : 'Cepat';
  SIAP = true; window.SIAP = true;
  if (catatan.length) tampilkan('<b>Catatan</b>\n' + catatan.join('\n'));
  if (Q.has('cek')) $('cek').click();
})();
// untuk otomatisasi (opsional): seek(t), DURATION, FPS, hasilCek(), lembarKontak(), thumbnail(), eksporMP4()
Object.defineProperty(window, 'DURATION', { get: () => DURASI });
Object.assign(window, { seek, hasilCek, lembarKontak, thumbnail, eksporMP4, FPS, M3 });
